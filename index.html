<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AgroTech ИИ – Вход</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            border-radius: 40px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0,20,0,0.2);
            text-align: center;
        }
        .auth-container input {
            width: 100%;
            margin: 10px 0;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-group button {
            flex: 1;
            background: #e0f0dc;
            color: #1a3f1a;
        }
        .error {
            color: red;
            margin: 8px 0;
        }
        .reset-link {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <h1>🌾 AgroTech ИИ</h1>
    <p>Цифровой агроном</p>
    <div class="btn-group">
        <button id="showLoginBtn">Вход</button>
        <button id="showRegisterBtn">Регистрация</button>
    </div>
    <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Логин">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <div id="loginError" class="error"></div>
        <button id="doLoginBtn">Войти</button>
        <div style="margin-top:12px; font-size:0.8rem;">Тестовый: demo / demo<br>Админ: admin / admin123</div>
    </div>
    <div id="registerForm" style="display:none;">
        <input type="text" id="regUsername" placeholder="Логин">
        <input type="password" id="regPassword" placeholder="Пароль">
        <div id="regError" class="error"></div>
        <button id="doRegisterBtn">Зарегистрироваться</button>
    </div>
    <div class="reset-link" id="resetDataBtn">⚠️ Сбросить данные (очистить localStorage)</div>
</div>
<script src="script.js"></script>
<script>
    (async function init() {
        await getUsers(); // гарантия создания demo и admin
        const users = await getUsers();
        console.log('Зарегистрированные пользователи:', users.map(u => u.login));
    })();
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    };
    document.getElementById('doLoginBtn').onclick = async () => {
        const login = document.getElementById('loginUsername').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();
        if (await loginUser(login, pass)) {
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('loginError').innerText = 'Неверный логин или пароль';
        }
    };
    document.getElementById('doRegisterBtn').onclick = async () => {
        const login = document.getElementById('regUsername').value.trim();
        const pass = document.getElementById('regPassword').value.trim();
        if (!login || !pass) {
            document.getElementById('regError').innerText = 'Заполните оба поля';
            return;
        }
        if (await registerUser(login, pass)) {
            alert('Регистрация успешна! Теперь войдите.');
            document.getElementById('showLoginBtn').click();
        } else {
            document.getElementById('regError').innerText = 'Логин уже занят';
        }
    };
    document.getElementById('resetDataBtn').onclick = () => {
        if (confirm('Очистить ВСЕ данные пользователей и истории? Это действие необратимо.')) {
            localStorage.clear();
            alert('Данные очищены. Перезагрузите страницу.');
            window.location.reload();
        }
    };
</script>
</body>
</html>
